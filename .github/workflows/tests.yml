name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: herd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (errors only)
        run: ruff check --select F821,F811,F401,E9 app run.py commands.py config.py
      - name: Migrations have a single head
        env:
          DATABASE_URL: sqlite:///ci.db
          SECRET_KEY: ci
          FLASK_APP: run.py
        run: test "$(flask db heads 2>/dev/null | grep -c '(head)')" = "1"
      - name: Tests (SQLite)
        run: python -m pytest tests -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/herd_test
        run: python -m pytest tests -q

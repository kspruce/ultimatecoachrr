<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84283A"/>
      <stop offset="1" stop-color="#561724"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2BC63"/>
      <stop offset="1" stop-color="#C79A3B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- flight trail -->
  <g stroke="#FBF6EC" stroke-linecap="round" fill="none">
    <path d="M70 214 H158" stroke-width="22" opacity=".9"/>
    <path d="M96 268 H164" stroke-width="22" opacity=".65"/>
    <path d="M128 322 H178" stroke-width="22" opacity=".4"/>
  </g>
  <!-- disc -->
  <g transform="rotate(-14 300 262)">
    <ellipse cx="300" cy="284" rx="150" ry="62" fill="#8A6522"/>
    <ellipse cx="300" cy="262" rx="150" ry="62" fill="url(#face)"/>
    <ellipse cx="300" cy="262" rx="104" ry="40" fill="none" stroke="#FBF6EC" stroke-width="10" opacity=".55"/>
  </g>
</svg>

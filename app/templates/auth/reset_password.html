{% extends "base.html" %}
{% block content %}
{% include "auth/_styles.html" %}

<div class="ac-wrap">
  <div class="ac-card">
    <div class="ac-icon"><i class="bi bi-key-fill"></i></div>
    <h1 class="ac-title">Choose a new password</h1>
    <p class="ac-sub">For <strong>{{ user.username }}</strong></p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <p class="ac-label">New password</p>
        <input type="password" name="password" class="ac-input" placeholder="At least 8 characters"
               required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-4">
        <p class="ac-label">Confirm new password</p>
        <input type="password" name="confirm_password" class="ac-input" placeholder="Repeat your password"
               required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="ac-btn"><i class="bi bi-check-circle me-2"></i>Save password</button>
    </form>
  </div>
</div>
{% endblock %}

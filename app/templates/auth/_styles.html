{# Shared look for the sign-in / sign-up / account pages #}
<style>
  .ac-wrap { max-width:460px; margin:3rem auto; }
  .ac-wrap.wide { max-width:560px; }
  .ac-card {
    background:var(--uc-card-bg); border:1px solid var(--uc-card-border);
    border-radius:var(--uc-radius); padding:2rem 1.75rem;
    box-shadow:var(--uc-shadow-md); margin-bottom:1.25rem;
  }
  .ac-icon {
    width:52px; height:52px; border-radius:13px;
    background:var(--club);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; color:var(--on-club); margin:0 auto 1rem;
  }
  .ac-title { font-weight:700; font-size:1.4rem; color:var(--uc-gray-800); margin-bottom:.35rem; text-align:center; }
  .ac-sub { color:var(--uc-gray-600); font-size:.9rem; text-align:center; margin-bottom:1.5rem; }
  .ac-section { font-size:.7rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
                color:var(--uc-blue); margin-bottom:.875rem; }
  .ac-label {
    font-size:.75rem; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--uc-gray-400); margin-bottom:.35rem;
  }
  .ac-input {
    width:100%; border:1px solid var(--uc-gray-200); border-radius:9px;
    padding:.65rem .875rem; font-size:.9rem; color:var(--uc-gray-800);
    background:var(--uc-card-bg); outline:none; transition:border-color .15s;
  }
  .ac-input:focus { border-color:var(--uc-blue); box-shadow:0 0 0 3px color-mix(in srgb, var(--club-ink) 12%, transparent); }
  .ac-hint { font-size:.75rem; color:var(--uc-gray-400); margin-top:.3rem; margin-bottom:0; }
  .ac-btn {
    display:block; width:100%; padding:.7rem; border-radius:9px; font-weight:600;
    font-size:.9rem; background:var(--uc-blue); color:white; border:none;
    cursor:pointer; transition:opacity .15s; text-align:center; text-decoration:none;
  }
  .ac-btn:hover { opacity:.9; color:white; }
  .ac-btn.secondary { background:transparent; color:var(--uc-blue); border:1px solid var(--uc-blue); }
  .ac-footer { text-align:center; font-size:.8rem; color:var(--uc-gray-400); margin-top:1rem; margin-bottom:0; }
  .ac-footer a { color:var(--uc-blue); font-weight:600; }
  .ac-code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em;
             text-transform:uppercase; text-align:center; font-size:1.1rem; }
  .ac-copy { display:flex; gap:.5rem; }
  .ac-copy input { flex:1; min-width:0; font-size:.8rem; }
</style>

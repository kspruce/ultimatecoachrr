{% extends "base.html" %}
{% block content %}
{% include "auth/_styles.html" %}

<div class="ac-wrap">
  <div class="ac-card">
    <div class="ac-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="ac-title">Two-step sign-in</h1>
    <p class="ac-sub">Enter the 6-digit code from your authenticator app for <strong>{{ user.username }}</strong>.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <p class="ac-label">Code</p>
        <input name="code" class="ac-input ac-code" inputmode="numeric" autocomplete="one-time-code"
               placeholder="123 456" required autofocus maxlength="12">
        <p class="ac-hint">Lost your phone? Enter one of your recovery codes instead.</p>
      </div>
      <button type="submit" class="ac-btn"><i class="bi bi-box-arrow-in-right me-2"></i>Log in</button>
    </form>
    <p class="ac-footer"><a href="{{ url_for('auth.login') }}">Start again</a></p>
  </div>
</div>
{% endblock %}

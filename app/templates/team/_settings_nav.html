{# Side menu shared by the team settings pages #}
<nav class="uc-settings-nav">
  <div class="uc-eyebrow mb-2 px-3">Team settings</div>
  <a href="{{ url_for('team.colour_settings') }}" class="{% if request.endpoint == 'team.colour_settings' %}on{% endif %}"><i class="bi bi-palette"></i> Colours &amp; crest</a>
  <a href="{{ url_for('team.feature_settings') }}" class="{% if request.endpoint == 'team.feature_settings' %}on{% endif %}"><i class="bi bi-sliders"></i> Features</a>
  <a href="{{ url_for('auth.users') }}"><i class="bi bi-people"></i> Members</a>
  {% if current_user.is_admin %}
  <a href="{{ url_for('team.data_settings') }}" class="{% if request.endpoint == 'team.data_settings' %}on{% endif %}"><i class="bi bi-database"></i> Your data</a>
  {% endif %}
  {% if has_endpoint('discord.settings') and current_user.is_admin %}
  <a href="{{ url_for('discord.settings') }}"><i class="bi bi-discord"></i> Discord</a>
  {% endif %}
</nav>

[build]
builder = "NIXPACKS"
# Install headless Chromium (+ system deps) for playbook PDF export
buildCommand = "playwright install --with-deps chromium"

[deploy]
# One process with threads, so a slow PDF export or backup doesn't hold up
# everyone else. Keep it to one process: the stats cache, rate limits,
# playbook export progress and the Discord bot all live in its memory.
startCommand = "gunicorn run:application --worker-class gthread --workers 1 --threads 8 --timeout 300"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
